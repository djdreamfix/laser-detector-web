<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>Laser Level Detector — PWA</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Laser Level Detector</h1>
    <div id="status">Готово</div>
  </header>

  <main>
    <div class="video-wrap">
      <video id="video" autoplay playsinline></video>
      <canvas id="overlay"></canvas>
    </div>

    <div class="controls">
      <button id="btnStart">Увімкнути камеру</button>
      <div class="row">
        <label>Режим:
          <select id="mode">
            <option value="auto">Авто</option>
            <option value="red">Червоний</option>
            <option value="green">Зелений</option>
            <option value="bright">Яскравість</option>
          </select>
        </label>

        <label>Чутливість:
          <input id="sensitivity" type="range" min="0.1" max="2.0" step="0.05" value="1.0">
        </label>
      </div>

      <div class="row small">
        <label><input id="mirror" type="checkbox"> Дзеркало</label>
        <label><input id="smooth" type="checkbox" checked> Згладжування</label>
        <label><input id="flicker" type="checkbox" checked> Фільтр мерехтіння</label>
      </div>

      <div class="row small">
        <button id="calib">Калібрування (фон)</button>
        <div id="found" class="indicator">Промінь: —</div>
        <div id="fps">FPS: —</div>
      </div>
    </div>

    <section class="instructions">
      <p>Порада: тримай телефон перпендикулярно поверхні, рухай повільно. Додай на головний екран: Share → Add to Home Screen.</p>
    </section>
  </main>

  <footer>
    <small>Обробка виконується локально. Ніяких даних назовні не відправляється.</small>
  </footer>

  <script src="app.js"></script>
</body>
</html>
